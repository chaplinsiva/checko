<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b141a"/>
      <stop offset="100%" stop-color="#111b21"/>
    </linearGradient>

    <!-- Emerald Glow Gradient -->
    <linearGradient id="primaryEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffb2"/>
      <stop offset="50%" stop-color="#00a884"/>
      <stop offset="100%" stop-color="#057a60"/>
    </linearGradient>

    <!-- Accent Cyan Gradient -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Sparkle / Check Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00a884" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#222d34" stroke-width="8"/>

  <!-- Ambient Glow Behind Icon -->
  <circle cx="256" cy="256" r="140" fill="#00a884" opacity="0.22" filter="url(#glow)"/>

  <!-- Main "C" Speech Bubble Clashing Ring -->
  <path d="M 330 145 C 295 125 240 120 190 145 C 130 175 105 240 115 305 C 128 375 190 415 260 415 C 310 415 355 390 385 350 C 375 350 330 350 310 320 C 290 300 290 280 290 280 C 275 295 255 305 230 305 C 185 305 155 270 155 225 C 155 180 190 145 235 145 C 270 145 300 165 315 195 L 375 160 C 360 140 345 130 330 145 Z" fill="url(#primaryEmerald)" filter="url(#softShadow)" opacity="0.3"/>

  <!-- Modern Stylized Chat Bubble with Dynamic Clash Cut -->
  <g filter="url(#softShadow)">
    <!-- Primary Conversation Bubble Outline -->
    <path d="M 380 230 C 380 155 315 100 240 100 C 160 100 95 160 95 240 C 95 285 118 325 152 352 L 140 405 C 138 412 145 418 152 414 L 210 380 C 220 382 230 383 240 383 C 315 383 380 320 380 230 Z" 
          fill="none" 
          stroke="url(#primaryEmerald)" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Lightning / Checkmark Core (Signifying Accuracy, Logic & Spark) -->
    <path d="M 235 170 L 195 265 L 245 265 L 215 350 L 325 240 L 265 240 L 305 170 Z" 
          fill="url(#sparkGrad)" 
          filter="url(#glow)"/>

    <!-- Dynamic Counter Dialogue Particle Bubble -->
    <circle cx="395" cy="145" r="28" fill="url(#accentCyan)" filter="url(#softShadow)"/>
    <circle cx="435" cy="195" r="16" fill="url(#primaryEmerald)"/>
  </g>
</svg>
